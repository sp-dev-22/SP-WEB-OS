plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sp.webos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sp.webos'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '5.3'
    }
}

dependencies {
    // APK signing (V1 + V2) fully on-device.
    implementation 'com.android.tools.build:apksig:8.3.0'
}

// Launcher icons ship in this repo as base64 text files (icon-b64/)
// because binary files cannot be uploaded through the Muse app.
// This task decodes them into real PNG mipmaps before every build.
def decodeLauncherIcons = tasks.register('decodeLauncherIcons') {
    def b64Dir = file('icon-b64')
    def resDir = file('src/main/res')
    inputs.dir(b64Dir)
    outputs.dir(resDir)
    doLast {
        b64Dir.eachFile { f ->
            if (!f.name.endsWith('.b64')) return
            def base = f.name - '.b64'              // e.g. mipmap-xxxhdpi_ic_launcher.png
            def dash = base.lastIndexOf('_')
            def folder = base.substring(0, dash)    // mipmap-xxxhdpi
            def name = base.substring(dash + 1)     // ic_launcher.png
            def out = new File(resDir, folder + '/' + name)
            out.parentFile.mkdirs()
            out.bytes = f.getText('UTF-8').trim().decodeBase64()
        }
    }
}
tasks.named('preBuild') { dependsOn(decodeLauncherIcons) }

// v5.3: three.min.js (three@0.160.0, pinned) ab BUILDER ke assets me
// jaata hai. "3D JS Library" feature ON ho to builder use generated app
// ke andar assets/three.min.js ke roop me jod deta hai (ApkMaker swap).
// File CI par CDN se download hoti hai (do mirrors); dono unreachable
// hon to build FAIL hota hai — chup-chaap gaayab nahi hoti.
def threeJsOutDir = file('build/generated/threejs-assets')
def fetchThreeJs = tasks.register('fetchThreeJs') {
    def target = new File(threeJsOutDir, 'three.min.js')
    outputs.file(target)
    outputs.upToDateWhen { target.exists() && target.length() > 100000 }
    doLast {
        if (target.exists() && target.length() > 100000) return
        threeJsOutDir.mkdirs()
        def urls = [
                'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js'
        ]
        Exception last = null
        for (u in urls) {
            try {
                new URL(u).withInputStream { ins ->
                    target.withOutputStream { out -> out << ins }
                }
                if (target.length() > 100000) { last = null; break }
                throw new IOException('downloaded file too small: ' + target.length())
            } catch (Exception e) {
                last = e
            }
        }
        if (last != null) {
            throw new GradleException('three.min.js download nahi ho paya (dono CDN fail): ' + last.message)
        }
    }
}

android {
    sourceSets {
        main {
            // src/main/assets ke saath generated threejs-assets dir bhi —
            // builder APK ke andar assets/three.min.js ban jata hai.
            assets.srcDirs = ['src/main/assets', 'build/generated/threejs-assets']
        }
    }
}

// Merge-assets tasks ko fetchThreeJs ke baad chalao taaki three.min.js
// pakka builder APK me shamil ho. (v5.1 ka sabak: tasks.named(...) wala
// finalizedBy configuration time par phatta hai, isliye matching +
// configureEach hi istemaal karo.)
tasks.named('preBuild') { dependsOn(fetchThreeJs) }
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }
        .configureEach { dependsOn(fetchThreeJs) }
