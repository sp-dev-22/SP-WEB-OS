plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sp.webos.builder'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sp.webos'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '5.2'
    }
}

dependencies {
    // Google's APK signing library (same one apksigner uses) — runs on-device.
    implementation 'com.android.tools.build:apksig:8.2.2'
}

// Launcher icons ship in this repo as base64 text files (icon-b64/) because
// the repo is maintained through an API that cannot carry binary files.
// Decode them into real PNG mipmaps under src/main/res before resources are
// processed, so the builder app itself gets a proper launcher icon.
// File names: ic_launcher-<density>.b64, ic_launcher_round-<density>.b64
def decodeLauncherIcons = tasks.register('decodeLauncherIcons') {
    def b64Dir = file('icon-b64')
    def resDir = file('src/main/res')
    inputs.dir(b64Dir)
    doLast {
        b64Dir.listFiles()?.findAll { it.name.endsWith('.b64') }?.each { f ->
            def base = f.name - '.b64'
            def dash = base.lastIndexOf('-')
            def iconName = base.substring(0, dash)
            def density = base.substring(dash + 1)
            def outDir = new File(resDir, "mipmap-${density}")
            outDir.mkdirs()
            new File(outDir, "${iconName}.png").bytes =
                    java.util.Base64.mimeDecoder.decode(f.getText('UTF-8').trim())
        }
    }
}
tasks.named('preBuild') { dependsOn(decodeLauncherIcons) }

// ---------------------------------------------------------------------------
// v5.1: chaar template flavors ko builder ke assets me pack karo.
// CI workflow pehle :template-app:assembleDebug chalata hai (saare flavors),
// isliye unke APKs ../template-app/build/outputs/apk/<flavor>/debug/ me
// taiyaar milte hain. Unhi ko yahan template_<kind>.apk naam se copy karke
// ek generated assets dir me rakha jata hai, jo main assets sourceSet me
// shamil hai. Local / standalone build me files na milein to Copy task
// chup chaap khaali reh jata hai — build fail nahi hota (us case me purani
// template.apk, jo workflow src/main/assets me dalta hai, istemaal hogi).
def templateApksDir = layout.buildDirectory.dir('generated/template-apks')
def embedTemplateApks = tasks.register('embedTemplateApks', Copy) {
    ['default', 'js3d', 'url', 'full'].each { kind ->
        from("../template-app/build/outputs/apk/${kind}/debug") {
            include "template-app-${kind}-debug.apk"
            rename { "template_${kind}.apk" }
        }
    }
    into templateApksDir
}
android {
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', templateApksDir.get().asFile]
        }
    }
}
tasks.named('preBuild') { dependsOn(embedTemplateApks) }
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }
        .configureEach { dependsOn(embedTemplateApks) }
