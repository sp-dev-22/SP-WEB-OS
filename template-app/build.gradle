plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sp.webos.template'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sp.webos.webapp'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        buildConfig true
    }

    // SP WEB OS v5.1 — ek hi template code, chaar "kind" (flavours).
    // SAB flavours ka applicationId ek hi hai (com.sp.webos.webapp, koi
    // suffix nahi) — builder ka ApkPatcher har flavour me wahi purana
    // package string dhoondh kar badalta hai, isliye ye zaroori hai.
    // Har flavour apna TEMPLATE_KIND BuildConfig me rakhta hai; shared
    // MainActivity usi par branch karta hai.
    flavorDimensions 'kind'
    productFlavors {
        create('default') {
            dimension 'kind'
            buildConfigField 'String', 'TEMPLATE_KIND', '"default"'
        }
        js3d {
            dimension 'kind'
            buildConfigField 'String', 'TEMPLATE_KIND', '"js3d"'
        }
        url {
            dimension 'kind'
            buildConfigField 'String', 'TEMPLATE_KIND', '"url"'
        }
        full {
            dimension 'kind'
            buildConfigField 'String', 'TEMPLATE_KIND', '"full"'
        }
    }
}

// CI workflow (.github/workflows/build.yml, badla nahi ja sakta) template
// build ke baad purani jagah se APK uthata hai:
//   cp template-app/build/outputs/apk/debug/template-app-debug.apk ...
// Flavours ke saath woh path apne aap nahi banta, isliye assembleDebug ke
// ant me default flavour ke APK ko wahan copy kar dete hain.
tasks.named('assembleDebug') {
    doLast {
        copy {
            from 'build/outputs/apk/default/debug/template-app-default-debug.apk'
            into 'build/outputs/apk/debug'
            rename { 'template-app-debug.apk' }
        }
    }
}

// Launcher icons ship in this repo as base64 text files (icon-b64/) because
// the repo is maintained through an API that cannot carry binary files.
// Decode them into real PNG mipmaps under src/main/res before resources are
// processed, so the template APK contains proper launcher icons that the
// builder app can later swap byte-for-byte with a user-designed icon.
// File names: ic_launcher-<density>.b64, ic_launcher_round-<density>.b64
def decodeLauncherIcons = tasks.register('decodeLauncherIcons') {
    def b64Dir = file('icon-b64')
    def resDir = file('src/main/res')
    inputs.dir(b64Dir)
    doLast {
        b64Dir.listFiles()?.findAll { it.name.endsWith('.b64') }?.each { f ->
            def base = f.name - '.b64'
            def dash = base.lastIndexOf('-')
            def iconName = base.substring(0, dash)
            def density = base.substring(dash + 1)
            def outDir = new File(resDir, "mipmap-${density}")
            outDir.mkdirs()
            new File(outDir, "${iconName}.png").bytes =
                    java.util.Base64.mimeDecoder.decode(f.getText('UTF-8').trim())
        }
    }
}
tasks.named('preBuild') { dependsOn(decodeLauncherIcons) }
