name: Build SP WEB OS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build template APK (Web App shell)
        run: gradle :template-app:assembleDebug --stacktrace

      - name: Embed template into builder app
        run: cp template-app/build/outputs/apk/debug/template-app-debug.apk builder-app/src/main/assets/template.apk

      - name: Build SP WEB OS (builder) APK
        run: gradle :builder-app:assembleDebug --stacktrace

      - name: Upload SP WEB OS APK
        uses: actions/upload-artifact@v4
        with:
          name: SP-WEB-OS-APK
          path: builder-app/build/outputs/apk/debug/builder-app-debug.apk
